<!DOCTYPE html>
<html>
<head>
  <title>Send Form Data to WhatsApp</title>
  <style>
    * {
      font-family: Arial, sans-serif;
    }
    form {
      width: 500px;
      margin: 0 auto;
      padding: 20px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    label {
      display: block;
      margin-bottom: 10px;
    }
    input, textarea {
      width: 100%;
      padding: 8px;
      margin-bottom: 10px;
      border-radius: 4px;
      border: 1px solid #ccc;
    }
    button {
      background-color: #4CAF50;
      color: white;
      padding: 10px 15px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background-color: #45a049;
    }
  </style>
</head>
<body>
  <form id="whatsappForm">
    <label for="name">Name:</label>
    <input type="text" id="name">

    <label for="email">Email:</label>
    <input type="text" id="email">

    <label for="country">Country:</label>
    <input type="text" id="country">

    <label for="message">Message:</label>
    <textarea id="message"></textarea>

    <button type="button" onclick="sendWhatsapp();">Send to WhatsApp</button>
  </form>

  <script>
    function sendWhatsapp() {
      var phonenumber = "919354028661"; // No '+' needed in wa.me link

      var name = document.getElementById('name').value;
      var email = document.getElementById('email').value;
      var country = document.getElementById('country').value;
      var message = document.getElementById('message').value;

      var url = "https://wa.me/" + phonenumber + "?text=" +
        "*Name:* " + encodeURIComponent(name) + "%0a" +
        "*Email:* " + encodeURIComponent(email) + "%0a" +
        "*Country:* " + encodeURIComponent(country) + "%0a" +
        "*Message:* " + encodeURIComponent(message) + "%0a" +
        "This is an example of sending a message to WhatsApp using JavaScript.";

      window.open(url, '_blank');
    }
  </script>
</body>
</html>
